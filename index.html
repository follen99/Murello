<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Murello · pianta 3D da draw.io</title>
  <meta name="description" content="Importa la pianta di casa disegnata su draw.io, guardala in 2D e 3D e prova la disposizione dei mobili prima di comprarli.">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1f22" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3.5 20.5V8.2L12 3.5l8.5 4.7v12.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 20.5v-6.2h4.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.4 14.3a4.4 4.4 0 0 1 4.4 4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.6 1.6"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-plan" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 12h7v8M11 4v4M15 12h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 5v14" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 9 5-9 5-9-5zM3 14l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.7-.9 1.3v.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1" fill="currentColor"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-sofa" viewBox="0 0 24 24"><path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M3.5 17v-4.5a1.5 1.5 0 0 1 3 0V14h11v-1.5a1.5 1.5 0 0 1 3 0V17zM6 17v2M18 17v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-ruler" viewBox="0 0 24 24"><path d="m3.5 15.5 12-12 5 5-12 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m7 12 2 2M10 9l1.5 1.5M13 6l2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-wand" viewBox="0 0 24 24"><path d="m4 20 11-11M13 7l2-2 4 4-2 2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 3v3M4.5 4.5h3M19 14v3M17.5 15.5h3M10 2.5v2M9 3.5h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8-9 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/></symbol>
      <symbol id="i-wall" viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 10h18M3 14h18M8 6v4M14 6v4M11 10v4M17 10v4M8 14v4M14 14v4" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
      <symbol id="i-door" viewBox="0 0 24 24"><path d="M4 20h16M6 20V4h9v16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12.5" cy="12.5" r="1" fill="currentColor"/></symbol>
      <symbol id="i-window" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.5v15M4.5 12h15" stroke="currentColor" stroke-width="1.4"/></symbol>
      <symbol id="i-picture" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m6.5 16 4-4.5 3 3 2-2 2.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 10v4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-top" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8" fill="currentColor"/><path d="m9 21 2.5-6 2.5 2.5V21M8 12l3-4 4 2 2 3M11.5 15 11 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m14 7 3 3" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-node" viewBox="0 0 24 24"><path d="M4 18 12 6l8 12" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="6" r="2.4" fill="currentColor"/><circle cx="4" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v4h4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-cut" viewBox="0 0 24 24"><path d="M3 15h18M6 15V8M10 15V5M14 15V8M18 15V6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 19h18" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <div id="app" class="app" aria-busy="true">
    <header class="topbar">
      <button class="iconbtn only-mobile" data-action="menu" data-i18n-title="menu.open"><svg><use href="#i-menu"/></svg></button>
      <a class="brand" href="./" aria-label="Murello"><svg class="brand-mark"><use href="#i-logo"/></svg><span class="brand-name">Murello</span></a>
      <input class="project-name" id="projectName" spellcheck="false" aria-label="Project name">
      <nav class="menubar only-desktop" aria-label="File">
        <button class="btn ghost" data-action="file-menu"><span data-i18n="menu.file"></span></button>
        <button class="iconbtn" data-action="undo" data-i18n-title="menu.undo"><svg><use href="#i-undo"/></svg></button>
        <button class="iconbtn" data-action="redo" data-i18n-title="menu.redo"><svg><use href="#i-redo"/></svg></button>
      </nav>
      <div class="spacer"></div>
      <div class="seg" role="tablist" id="viewSwitch">
        <button data-view="2d" data-i18n-title="view.2d"><svg><use href="#i-plan"/></svg><span>2D</span></button>
        <button data-view="3d" data-i18n-title="view.3d"><svg><use href="#i-cube"/></svg><span>3D</span></button>
        <button data-view="split" class="only-desktop" data-i18n-title="view.split"><svg><use href="#i-split"/></svg></button>
      </div>
      <label class="floor-select"><svg><use href="#i-layers"/></svg><select id="floorSelect" aria-label="Floor"></select></label>
      <button class="iconbtn only-desktop" data-action="settings" data-i18n-title="menu.settings"><svg><use href="#i-gear"/></svg></button>
      <button class="iconbtn only-desktop" data-action="help" data-i18n-title="menu.help"><svg><use href="#i-help"/></svg></button>
    </header>

    <div class="workspace">
      <nav class="rail" id="rail" aria-label="Panels">
        <button data-panel="library"><svg><use href="#i-sofa"/></svg><span data-i18n="panel.library"></span></button>
        <button data-panel="structure"><svg><use href="#i-wall"/></svg><span data-i18n="panel.structure"></span></button>
        <button data-panel="tools"><svg><use href="#i-ruler"/></svg><span data-i18n="panel.tools"></span></button>
        <button data-panel="furnish"><svg><use href="#i-wand"/></svg><span data-i18n="panel.furnish"></span></button>
        <button data-panel="rules" class="only-desktop-rail"><svg><use href="#i-tag"/></svg><span data-i18n="panel.rules"></span></button>
        <button data-panel="more" class="only-mobile"><svg><use href="#i-more"/></svg><span data-i18n="panel.more"></span></button>
      </nav>
      <aside class="sidepanel" id="sidepanel" aria-live="polite">
        <div class="sheet-handle only-mobile" aria-hidden="true"></div>
        <div class="panel-head"><h2 id="panelTitle"></h2><button class="iconbtn" data-action="close-panel"><svg><use href="#i-close"/></svg></button></div>
        <div class="panel-body" id="panelBody"></div>
      </aside>
      <main class="views" id="views">
        <section class="view view-2d" id="view2d" aria-label="2D"></section>
        <section class="view view-3d" id="view3d" aria-label="3D">
          <div class="view-tools" id="tools3d">
            <button class="iconbtn" data-cam="iso" data-i18n-title="cam.iso"><svg><use href="#i-cube"/></svg></button>
            <button class="iconbtn" data-cam="top" data-i18n-title="cam.top"><svg><use href="#i-top"/></svg></button>
            <button class="iconbtn" data-cam="front" data-i18n-title="cam.front"><svg><use href="#i-walk"/></svg></button>
            <label class="cut" data-i18n-title="cam.cut"><svg><use href="#i-cut"/></svg><input type="range" id="cutRange" min="0.4" max="4" step="0.05" value="4"></label>
          </div>
        </section>
        <section class="view view-2d-tools" id="tools2d">
          <button class="iconbtn" data-action="fit2d" data-i18n-title="cam.fit"><svg><use href="#i-target"/></svg></button>
        </section>
        <div class="empty-state" id="emptyState" hidden></div>
      </main>
      <aside class="inspector" id="inspector" hidden>
        <div class="sheet-handle only-mobile" aria-hidden="true"></div>
        <div class="panel-head"><h2 id="inspTitle"></h2><button class="iconbtn" data-action="deselect"><svg><use href="#i-close"/></svg></button></div>
        <div class="panel-body" id="inspBody"></div>
      </aside>
    </div>
    <footer class="statusbar only-desktop" id="statusbar"></footer>
  </div>

  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <div class="ctxmenu" id="ctxmenu" hidden></div>
  <input type="file" id="fileInput" accept=".drawio,.xml,.json,.murello,.svg,application/xml,application/json" hidden>
  <noscript><p class="noscript">Murello richiede JavaScript. · Murello needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
